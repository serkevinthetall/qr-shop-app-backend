[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

# Store URLs are public links, not secrets — Netlify flagged the Play Store
# fallback string in src/server.js matching ANDROID_STORE_URL env.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ANDROID_STORE_URL,IOS_STORE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http"]

[functions.api]
  timeout = 26

# Official Express-on-Netlify rewrite: /api/* → function (keeps Express /api routes)
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# Health / root
[[redirects]]
  force = true
  from = "/"
  status = 200
  to = "/.netlify/functions/api"
