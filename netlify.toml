[build]
  command = "npm install"
  publish = "public"
  # Skip Netlify rebuild when only Vercel/app files change (saves build minutes).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml netlify/ package.json package-lock.json src/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Free tier max is lower; paid can raise this. Odoo calls can be slow.
  [functions.api]
    timeout = 26

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
